[package]
name = "streamdeck-plugin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for creating and managing native Stream Deck plugins in Rust"
publish = false
readme = "README.md"
keywords = ["streamdeck", "elgato", "plugin", "cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "templates/**/*", "README.md", "LICENSE"]

[[bin]]
name = "streamdeck-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
ignore = "0.4"
indicatif = "0.17"
inquire = "0.7"
open = "5"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
junction = "1"
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
