[package]
name = "increment-counter"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "increment-counter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-plugin = { path = "../../crates/streamdeck-plugin" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
